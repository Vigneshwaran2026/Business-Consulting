<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 - Page Not Found | Stackly</title>

  <meta name="description" content="The page you are looking for could not be found.">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    /* =========================================
       ROOT
    ========================================= */

    :root {
      --primary-green: #063d2f;
      --secondary-yellow: #fbd819;
      --white: #ffffff;
      --light-bg: #f7faf8;
      --dark-text: #063d2f;
      --gray-text: #66736f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      background: var(--light-bg);
      color: var(--dark-text);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }


    /* =========================================
       MAIN 404 SECTION
    ========================================= */

    .error_page {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 20%, rgba(251, 216, 25, 0.14), transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(6, 61, 47, 0.12), transparent 30%),
        var(--light-bg);
    }


    /* =========================================
       BACKGROUND SHAPES
    ========================================= */

    .shape {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .shape_one {
      width: 280px;
      height: 280px;
      top: -120px;
      left: -100px;
      border-radius: 50%;
      background: var(--primary-green);
      opacity: 0.08;
      animation: floatShape 7s ease-in-out infinite;
    }

    .shape_two {
      width: 220px;
      height: 220px;
      right: -80px;
      bottom: -70px;
      border-radius: 50%;
      background: var(--secondary-yellow);
      opacity: 0.18;
      animation: floatShape 6s ease-in-out infinite reverse;
    }

    .shape_three {
      width: 75px;
      height: 75px;
      top: 18%;
      right: 12%;
      border: 2px solid var(--secondary-yellow);
      border-radius: 50%;
      animation: rotateShape 12s linear infinite;
    }

    .shape_four {
      width: 55px;
      height: 55px;
      bottom: 18%;
      left: 12%;
      border: 2px solid var(--primary-green);
      transform: rotate(45deg);
      opacity: 0.15;
      animation: rotateShape 10s linear infinite reverse;
    }


    /* =========================================
       DECORATIVE DOTS
    ========================================= */

    .dots {
      position: absolute;
      width: 120px;
      height: 120px;
      background-image: radial-gradient(
        var(--primary-green) 1.5px,
        transparent 1.5px
      );
      background-size: 14px 14px;
      opacity: 0.12;
    }

    .dots_left {
      left: 7%;
      top: 25%;
    }

    .dots_right {
      right: 7%;
      bottom: 24%;
    }


    /* =========================================
       ERROR CONTENT
    ========================================= */

    .error_container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      text-align: center;
    }


    /* =========================================
       LOGO
    ========================================= */

    .error_logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 35px;
      animation: fadeDown 0.8s ease forwards;
    }

    .error_logo img {
      width: 150px;
      height: auto;
      display: block;
    }


    /* =========================================
       404 NUMBER
    ========================================= */

    .error_number_wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
    }

    .error_number {
      position: relative;
      font-family: "Manrope", sans-serif;
      font-size: clamp(150px, 24vw, 280px);
      font-weight: 800;
      line-height: 0.82;
      letter-spacing: -15px;
      color: var(--primary-green);
      user-select: none;
      animation: numberReveal 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .error_number span {
      display: inline-block;
    }

    .error_number .yellow_zero {
      color: var(--secondary-yellow);
      position: relative;
      animation:
        yellowPulse 3s ease-in-out infinite,
        zeroFloat 4s ease-in-out infinite;
    }

    .yellow_zero::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      top: 16%;
      right: 13%;
      border-radius: 50%;
      background: var(--white);
      border: 7px solid var(--primary-green);
      animation: eyePulse 2.5s ease-in-out infinite;
    }


    /* =========================================
       YELLOW UNDERLINE
    ========================================= */

    .error_underline {
      width: 180px;
      height: 7px;
      margin: 20px auto 30px;
      border-radius: 20px;
      background: var(--secondary-yellow);
      animation: underlineGrow 1s ease 0.5s both;
    }


    /* =========================================
       CONTENT
    ========================================= */

    .error_subtitle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--primary-green);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeUp 0.8s ease 0.4s both;
    }

    .error_subtitle::before,
    .error_subtitle::after {
      content: "";
      width: 30px;
      height: 2px;
      background: var(--secondary-yellow);
    }

    .error_title {
      margin-bottom: 15px;
      font-family: "Manrope", sans-serif;
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 800;
      line-height: 1.15;
      color: var(--primary-green);
      animation: fadeUp 0.8s ease 0.55s both;
    }

    .error_description {
      max-width: 590px;
      margin: 0 auto 30px;
      color: var(--gray-text);
      font-size: 16px;
      line-height: 1.8;
      animation: fadeUp 0.8s ease 0.7s both;
    }


    /* =========================================
       BUTTONS
    ========================================= */

    .error_buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      animation: fadeUp 0.8s ease 0.85s both;
    }

    .error_btn {
      min-width: 175px;
      height: 54px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.3s ease,
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .home_btn {
      color: var(--primary-green);
      background: var(--secondary-yellow);
      border: 2px solid var(--secondary-yellow);
      box-shadow: 0 12px 25px rgba(251, 216, 25, 0.22);
    }

    .home_btn:hover {
      color: var(--white);
      background: var(--primary-green);
      border-color: var(--primary-green);
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(6, 61, 47, 0.2);
    }

    .back_btn {
      color: var(--primary-green);
      background: var(--white);
      border: 2px solid var(--primary-green);
    }

    .back_btn:hover {
      color: var(--white);
      background: var(--primary-green);
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(6, 61, 47, 0.18);
    }

    .error_btn i {
      font-size: 14px;
      transition: transform 0.3s ease;
    }

    .home_btn:hover i {
      transform: translateX(4px);
    }

    .back_btn:hover i {
      transform: translateX(-4px);
    }


    /* =========================================
       BOTTOM MESSAGE
    ========================================= */

    .error_bottom_text {
      margin-top: 35px;
      color: #89938f;
      font-size: 13px;
      animation: fadeUp 0.8s ease 1s both;
    }

    .error_bottom_text span {
      color: var(--secondary-yellow);
      font-size: 16px;
      margin: 0 4px;
    }


    /* =========================================
       ANIMATIONS
    ========================================= */

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes numberReveal {
      from {
        opacity: 0;
        transform: scale(0.65) translateY(40px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes underlineGrow {
      from {
        width: 0;
        opacity: 0;
      }

      to {
        width: 180px;
        opacity: 1;
      }
    }

    @keyframes yellowPulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }

    @keyframes zeroFloat {
      0%,
      100% {
        margin-top: 0;
      }

      50% {
        margin-top: -8px;
      }
    }

    @keyframes eyePulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(0.82);
      }
    }

    @keyframes floatShape {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(20px, -20px);
      }
    }

    @keyframes rotateShape {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 767px) {

      .error_page {
        min-height: 100svh;
        padding: 35px 18px;
      }

      .error_logo {
        margin-bottom: 25px;
      }

      .error_logo img {
        width: 125px;
      }

      .error_number {
        font-size: clamp(120px, 38vw, 190px);
        letter-spacing: -8px;
      }

      .yellow_zero::after {
        width: 18px;
        height: 18px;
        border-width: 5px;
      }

      .error_underline {
        height: 5px;
        width: 120px;
        margin: 15px auto 25px;
      }

      .error_subtitle {
        font-size: 12px;
        letter-spacing: 1.5px;
      }

      .error_subtitle::before,
      .error_subtitle::after {
        width: 20px;
      }

      .error_title {
        font-size: 30px;
      }

      .error_description {
        font-size: 14px;
        line-height: 1.7;
      }

      .error_buttons {
        flex-direction: column;
        width: 100%;
      }

      .error_btn {
        width: 100%;
        max-width: 280px;
      }

      .dots {
        display: none;
      }

      .shape_three,
      .shape_four {
        display: none;
      }
    }


    @media (max-width: 400px) {

      .error_number {
        font-size: 115px;
      }

      .error_title {
        font-size: 27px;
      }

      .error_description {
        font-size: 13px;
      }

    }


    /* =========================================
       ACCESSIBILITY
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

    }
  </style>
</head>


<body>

  <main class="error_page">

    <!-- Background Shapes -->
    <div class="shape shape_one"></div>
    <div class="shape shape_two"></div>
    <div class="shape shape_three"></div>
    <div class="shape shape_four"></div>

    <!-- Decorative Dots -->
    <div class="dots dots_left"></div>
    <div class="dots dots_right"></div>


    <div class="error_container">

      <!-- 404 Number -->
      <div class="error_number_wrap">

        <div class="error_number">
          <span>4</span>
          <span class="yellow_zero">0</span>
          <span>4</span>
        </div>

      </div>


      <!-- Underline -->
      <div class="error_underline"></div>


      <!-- Content -->
      <div class="error_subtitle">
        Page Not Found
      </div>

      <h1 class="error_title">
        Looks Like You’re Lost
      </h1>

      <p class="error_description">
        The page you are looking for may have been moved, removed,
        or is temporarily unavailable. Let’s get you back to where
        your journey began.
      </p>


      <!-- Buttons -->
      <div class="error_buttons">

        <!-- Back to Home -->
        <a href="index.html" class="error_btn home_btn">
          <span>Back to Home</span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>


        <!-- Browser Back -->
        <button
          type="button"
          class="error_btn back_btn"
          onclick="goBack()">

          <i class="fa-solid fa-arrow-left"></i>
          <span>Go Back</span>

        </button>

      </div>


      <!-- Bottom Text -->
      <div class="error_bottom_text">
        Need help finding something?
        <span>•</span>
        Return to our homepage
      </div>

    </div>

  </main>


  <script>
    function goBack() {

      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }

    }
  </script>

</body>

</html>
